[settings]
pypi.uvx = true
idiomatic_version_file_enable_tools = ["node"]
# Nothing installs or trusts a config on its own: an agent goes through an approved mise install
paranoid = true
auto_install = false
exec_auto_install = false
not_found_auto_install = false
not_found_system_fallback = false
# Only the backends in use: the others install unverified binaries or build arbitrary code
disable_backends = ["asdf", "cargo", "conda", "dotnet", "forgejo", "gitlab", "go", "http", "packslip", "s3", "spinel", "spm", "ubi", "vfox"]
# Locks this file's tools only: a project without a mise.lock still installs
locked = true
locked_scopes = ["global"]
locked_verify_provenance = true
minimum_release_age = "7d"
use_versions_host_track = false

