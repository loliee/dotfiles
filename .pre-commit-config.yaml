---
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-symlinks
      - id: debug-statements
      - id: detect-private-key
      - id: requirements-txt-fixer
      - id: trailing-whitespace

  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.12.0-2
    hooks:
      - id: shfmt
  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.11.0
    hooks:
      - id: shellcheck
  - repo: local
    hooks:
      - id: luacheck
        name: Run luacheck
        entry: luacheck
        language: system
        types: [lua]
        pass_filenames: true
        description: Custom hook to lint Lua files using luacheck
      - id: taplo-lint
        name: Run taplo lint
        entry: taplo lint
        language: system
        types: [toml]
        pass_filenames: true
        description: Custom hook to lint TOML files using taplo
      - id: taplo-format
        name: Run taplo format --check
        entry: taplo format --check
        language: system
        types: [toml]
        pass_filenames: true
        description: Custom hook to check TOML formatting using taplo
