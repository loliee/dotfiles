---
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-symlinks
      - id: debug-statements
      - id: detect-private-key
      - id: requirements-txt-fixer
      - id: trailing-whitespace
  - repo: https://github.com/adrienverge/yamllint.git
    rev: v1.29.0
    hooks:
      - id: yamllint
  - repo: local
    hooks:
      - id: shfmt
        name: Run shfmt
        entry: shfmt --write
        language: system
        types: [shell]
        exclude_types: [csh, tcsh, zsh]
        pass_filenames: true
        description: Custom hook to format shell scripts using shfmt
      - id: shellcheck
        name: Run shellcheck
        entry: shellcheck
        language: system
        types: [shell]
        pass_filenames: true
        description: Custom hook to lint shell scripts using shellcheck
      - id: fish-syntax
        name: Run fish --no-execute
        # fish -n only checks its first file, hence the loop
        entry: fish -N -c 'set -l rc 0; for f in $argv; fish --no-execute $f; or set rc 1; end; exit $rc'
        language: system
        types: [fish]
        pass_filenames: true
        description: Custom hook to check fish syntax
      - id: luacheck
        name: Run luacheck
        entry: luacheck
        language: system
        types: [lua]
        pass_filenames: true
        description: Custom hook to lint Lua files using luacheck
      - id: taplo-lint
        name: Run taplo lint
        entry: taplo lint
        language: system
        types: [toml]
        pass_filenames: true
        description: Custom hook to lint TOML files using taplo
      - id: taplo-format
        name: Run taplo format --check
        entry: taplo format --check
        language: system
        types: [toml]
        pass_filenames: true
        description: Custom hook to check TOML formatting using taplo
      - id: markdownlint
        name: Run markdownlint
        entry: mdl
        language: system
        types: [markdown]
        pass_filenames: true
        description: Custom hook to run markdownlint
