---
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-json
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: check-symlinks
      - id: debug-statements
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: requirements-txt-fixer
      - id: trailing-whitespace
  - repo: https://github.com/adrienverge/yamllint.git
    rev: cba56bcde1fdd01c1deb3f945e69764c291a6530  # frozen: v1.38.0
    hooks:
      - id: yamllint
  - repo: https://github.com/codespell-project/codespell
    rev: 57b21406f092110c18776e39b0bda50d37c945c8  # frozen: v2.4.3
    hooks:
      - id: codespell
        # Generated lockfiles: base64 integrity hashes read as misspellings
        exclude: ^\.config/mise/locks/
        # Vim's :enew, not a typo of "new"
        args: [--ignore-words-list=enew]
  - repo: local
    hooks:
      - id: shfmt
        name: Run shfmt
        entry: shfmt --write
        language: system
        types: [shell]
        exclude_types: [csh, tcsh, zsh]
        pass_filenames: true
        description: Custom hook to format shell scripts using shfmt
      - id: shellcheck
        name: Run shellcheck
        entry: shellcheck
        language: system
        types: [shell]
        pass_filenames: true
        description: Custom hook to lint shell scripts using shellcheck
      - id: fish-syntax
        name: Run fish --no-execute
        # fish -n only checks its first file, hence the loop
        entry: fish -N -c 'set -l rc 0; for f in $argv; fish --no-execute $f; or set rc 1; end; exit $rc'
        language: system
        types: [fish]
        pass_filenames: true
        description: Custom hook to check fish syntax
      - id: luacheck
        name: Run luacheck
        entry: luacheck
        language: system
        types: [lua]
        pass_filenames: true
        description: Custom hook to lint Lua files using luacheck
      - id: taplo-lint
        name: Run taplo lint
        entry: taplo lint
        language: system
        types: [toml]
        pass_filenames: true
        description: Custom hook to lint TOML files using taplo
      - id: taplo-format
        name: Run taplo format --check
        entry: taplo format --check
        language: system
        types: [toml]
        pass_filenames: true
        description: Custom hook to check TOML formatting using taplo
      - id: markdownlint
        name: Run markdownlint
        entry: mdl
        language: system
        types: [markdown]
        pass_filenames: true
        description: Custom hook to run markdownlint
