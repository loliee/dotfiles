# Tmux portable conf
# changelog https://github.com/tmux/tmux/blob/c84ed36719f8bfc72ef52e8e0a43003464de587e/CHANGES

# act like vim
setw -g mode-keys vi
set -g status-keys vi
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind-key -r C-h select-window -t :-
bind-key -r C-l select-window -t :+

# reload the file with Prefix r
bind r source-file ~/.tmux.conf \; display 'Reloaded !'

# Faster escape sequences (default is 500ms).
# This helps when exiting insert mode in Vim: http://superuser.com/a/252717/65504
set -s escape-time 50

# increase scrollback lines
set -g history-limit 50000

# scroll history
bind u copy-mode

# switch to last pane
bind-key C-a last-pane

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1

# Split window with | and -
unbind %
bind | split-window -h
bind - split-window -v

# Status bar update interval
set -g status-interval 2

# enable activity alerts
setw -g monitor-activity on
set -g visual-activity on

# display session name as title in terminal tab
set -g set-titles on
setw -g automatic-rename on

# Log output to a text file on demand
bind g pipe-pane -o "cat >> ~/tmp/tmux.#W.log" \; display "Started logging to ~/tmp/tmux.#W.log"
bind-key G pipe-pane \; display 'Ended logging to ~/tmp/tmux.#W.log'

# (tmux >= 1.6)
if-shell '[ $(tmux -V | cut -d" " -f2 | awk -F. "{print \$1*1000 + \$2}") -gt 1006 ]' \
  "set -g renumber-windows on; set-option -g status-position top"

# (tmux >= 1.8)
if-shell '[ $(tmux -V | cut -d" " -f2 | awk -F. "{print \$1*1000 + \$2}") -gt 1008 ]' \
  "set -g renumber-windows on; bind Enter resize-pane -Z"

# (tmux < 2.9)
if-shell '[ $(tmux -V | cut -d" " -f2 | awk -F. "{print \$1*1000 + \$2}") -lt 2009 ]' \
  "set -g message-fg black; set -g message-bg color3; set -g message-attr bright; \
  set -g status-fg colour234; set -g status-bg colour3; set -g pane-active-border-fg color3; \
  set -g pane-border-fg gray"

# (tmux >= 2.9)
if-shell '[ $(tmux -V | cut -d" " -f2 | awk -F. "{print \$1*1000 + \$2}") -ge 2009 ]' \
  "set -g message-style fg=black,bg=yellow; set -g status-style fg=black,bg=yellow; \
  set -g pane-active-border-style fg=yellow; set -g pane-border-style fg=gray"

# Local config
if-shell "[ -f ~/.tmux.conf.local ]" 'source ~/.tmux.conf.local'
