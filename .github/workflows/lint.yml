---
name: Lint

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

"on":
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  prek:
    runs-on: ubuntu-latest
    env:
      # The repo's mise.toml only: .config/mise/config.toml is the home config, not CI's
      MISE_OVERRIDE_CONFIG_FILENAMES: mise.toml
      MISE_LOCKED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Not in the mise registry; Ubuntu's own fish is 3.x, fish_indent must match the local 4.x
      - name: Install fish and luacheck
        run: |
          sudo add-apt-repository -y ppa:fish-shell/release-4
          sudo apt-get update && sudo apt-get install -y fish luarocks
          sudo luarocks install luacheck 1.2.0-1
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.10.8
      - name: Run prek
        run: prek run --all-files --show-diff-on-failure
