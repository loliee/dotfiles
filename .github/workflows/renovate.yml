---
name: Renovate

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

"on":
  schedule:
    - cron: 0 5 * * 1
  workflow_dispatch:

permissions: {}

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      # An App token, not GITHUB_TOKEN: PRs opened with GITHUB_TOKEN don't trigger the Lint workflow
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-checks: read
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
          permission-statuses: write
          permission-vulnerability-alerts: read
          permission-workflows: write
      - uses: renovatebot/github-action@a63d9a7bc606f7336fd20b47f2f32259a35e6213 # v46.3.9
        with:
          token: ${{ steps.app-token.outputs.token }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: "false"
          RENOVATE_REQUIRE_CONFIG: required
          # Without it Renovate bumps mise.toml but leaves mise.lock stale
          RENOVATE_ALLOWED_UNSAFE_EXECUTIONS: '["mise"]'
          # The repo's mise.toml only: from the clone, the home config's locked = true locks mise.toml too
          RENOVATE_CUSTOM_ENV_VARIABLES: '{"MISE_OVERRIDE_CONFIG_FILENAMES":"mise.toml"}'
          # The home config's lock, run by renovate.json's postUpgradeTasks
          RENOVATE_ALLOWED_COMMANDS: '["^[.]github/scripts/mise-lock-home [-.:/@a-zA-Z0-9_]+$"]'
          RENOVATE_PLATFORM_COMMIT: enabled
