---
name: Renovate

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

"on":
  schedule:
    - cron: 0 5 * * 1
  workflow_dispatch:

permissions: {}

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      # An App token, not GITHUB_TOKEN: PRs opened with GITHUB_TOKEN don't trigger the Lint workflow
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-checks: read
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
          permission-statuses: write
          permission-vulnerability-alerts: read
          permission-workflows: write
      - uses: renovatebot/github-action@f0f41e5f2e706165f6814b1d0f0d0e319de7d1d9 # v46.3.8
        with:
          token: ${{ steps.app-token.outputs.token }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: "false"
          RENOVATE_REQUIRE_CONFIG: required
          # Without it Renovate bumps mise.toml but leaves mise.lock stale
          RENOVATE_ALLOWED_UNSAFE_EXECUTIONS: '["mise"]'
          RENOVATE_PLATFORM_COMMIT: enabled
