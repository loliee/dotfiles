---
name: Renovate

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

"on":
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      # An App token, not GITHUB_TOKEN: PRs opened with GITHUB_TOKEN don't trigger the Lint workflow
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-checks: read
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
          permission-statuses: read
          permission-workflows: write
      - uses: renovatebot/github-action@230ce922b08968d0a4f6f70f295601daff09ef1d # v46.3.7
        with:
          token: ${{ steps.app-token.outputs.token }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: "false"
          RENOVATE_REQUIRE_CONFIG: required
          # Without it Renovate bumps mise.toml but leaves mise.lock stale
          RENOVATE_ALLOWED_UNSAFE_EXECUTIONS: '["mise"]'
          RENOVATE_PLATFORM_COMMIT: enabled
